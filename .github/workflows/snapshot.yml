name: snapshot

on:
  schedule:
    # Every hour at :17 to stay clear of the top-of-hour scheduler rush.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out data repository
        uses: actions/checkout@v5

      - name: Check out skills (private, read-only token)
        uses: actions/checkout@v5
        with:
          repository: Kenny-Dhub/my-game-site-skills
          token: ${{ secrets.SKILLS_READ_TOKEN }}
          path: skills
          sparse-checkout: my-roblox-game-discovery
          persist-credentials: false

      - name: Discover, select, snapshot
        shell: bash
        run: |
          set -euo pipefail
          S=skills/my-roblox-game-discovery/scripts/discovery.py
          month=$(date -u +%Y-%m)
          mkdir -p data/discover data/errors
          # A chart failure must not stop snapshots of games already tracked.
          if ! python3 "$S" discover --source explore --out data/discover/latest.json --ids-out "$RUNNER_TEMP/chart-ids.txt"; then
            echo "::warning::discover failed; snapshotting tracked games only"
            : > "$RUNNER_TEMP/chart-ids.txt"
          fi
          python3 scripts/select_ids.py --chart-ids "$RUNNER_TEMP/chart-ids.txt" \
            --tracked data/tracked.txt --exclude data/exclude.txt --history-dir data/history
          python3 "$S" snapshot --history-dir data/history --universe-file data/tracked.txt \
            --errors-out "data/errors/$month.jsonl"

      - name: Daily rank (first run of each UTC day)
        shell: bash
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          # Keyed on the file, not the hour: a delayed or dropped 00:17 run must not skip the day.
          if [ -f "reports/daily/$day.md" ]; then echo "already ranked $day"; exit 0; fi
          python3 skills/my-roblox-game-discovery/scripts/discovery.py rank --history-dir data/history \
            --out data/candidates/latest.json --markdown-out "reports/daily/$day.md"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "snapshot $(date -u +%FT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::push failed after 3 attempts"; exit 1
